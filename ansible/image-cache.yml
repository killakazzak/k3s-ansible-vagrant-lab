---
- name: Create image import directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/images
    state: directory
    mode: '0755'
- name: Copy cached container archives
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/lib/rancher/k3s/agent/images/{{ item | basename }}"
    mode: '0644'
  loop: "{{ hostvars['localhost'].cached_image_archives }}"
- name: Enable conditional image imports on subsequent boots
  ansible.builtin.copy:
    content: '{}'
    dest: /var/lib/rancher/k3s/agent/images/.cache.json
    force: false
    mode: '0644'
