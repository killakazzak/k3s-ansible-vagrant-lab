---
- name: Cache verified k3s release once on the host
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [group_vars/all.yml]
  vars:
    k3s_binary: "{{ 'k3s-arm64' if vm_architecture == 'arm64' else 'k3s' }}"
    k3s_asset_arch: "{{ 'arm64' if vm_architecture == 'arm64' else 'amd64' }}"
    asset_socket_timeout: "{{ lookup('env', 'K3S_DOWNLOAD_CONNECT_TIMEOUT') | default('10', true) | int }}"
    ansible_become: false
    ansible_ssh_private_key_file: ""
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Select shared versioned cache
      ansible.builtin.set_fact:
        asset_cache: "{{ lookup('env', 'K3S_LAB_CACHE_ROOT') | default(lookup('env', 'HOME') + '/.cache/k3s-lab', true) }}/{{ k3s_version }}"
    - name: Create local cache
      ansible.builtin.file:
        path: "{{ asset_cache }}"
        state: directory
        mode: '0700'
    - name: Detect offline release bundle
      ansible.builtin.set_fact:
        offline_bundle: "{{ playbook_dir }}/../vendor/offline"
        use_offline_bundle: "{{ lookup('ansible.builtin.fileglob', playbook_dir + '/../vendor/offline/manifest.json') | length > 0 }}"
    - name: Validate offline versions
      ansible.builtin.assert:
        that:
          - vm_architecture == 'arm64'
          - (lookup('file', offline_bundle + '/manifest.json') | from_json).k3s_version == k3s_version
          - not rancher_enabled | bool or (lookup('file', offline_bundle + '/manifest.json') | from_json).rancher_version == rancher_version
          - not rancher_enabled | bool or (lookup('file', offline_bundle + '/manifest.json') | from_json).cert_manager_version == cert_manager_version
        fail_msg: Offline bundle versions differ from cluster configuration. Prepare a matching bundle.
      when: use_offline_bundle | bool
    - name: Copy k3s assets from offline bundle
      ansible.builtin.copy:
        src: "{{ offline_bundle }}/k3s/{{ item }}"
        dest: "{{ asset_cache }}/{{ item }}"
        mode: '0755'
      loop: ["{{ k3s_binary }}", install.sh]
      when: use_offline_bundle | bool
    - name: "Загрузка {{ k3s_binary }} и SHA256 — {{ k3s_release_url }}"
      when: not use_offline_bundle | bool
      register: asset_download_result
      retries: 3
      delay: 2
      until: asset_download_result is succeeded
      ansible.builtin.get_url:
        url: "{{ k3s_release_url }}/{{ k3s_binary }}"
        checksum: "sha256:{{ k3s_release_url }}/sha256sum-{{ k3s_asset_arch }}.txt"
        dest: "{{ asset_cache }}/{{ k3s_binary }}"
        mode: '0755'
        timeout: "{{ asset_socket_timeout }}"
    - name: "Загрузка install.sh — {{ k3s_installer_url }}"
      when: not use_offline_bundle | bool
      register: asset_download_result
      retries: 3
      delay: 2
      until: asset_download_result is succeeded
      ansible.builtin.get_url:
        url: "{{ k3s_installer_url }}"
        dest: "{{ asset_cache }}/install.sh"
        mode: '0644'
        timeout: "{{ asset_socket_timeout }}"
    - name: "Загрузка k3s-airgap-images-{{ k3s_asset_arch }}.tar.zst — {{ k3s_release_url }}"
      register: asset_download_result
      retries: 3
      delay: 2
      until: asset_download_result is succeeded
      ansible.builtin.get_url:
        url: "{{ k3s_release_url }}/k3s-airgap-images-{{ k3s_asset_arch }}.tar.zst"
        checksum: "sha256:{{ k3s_release_url }}/sha256sum-{{ k3s_asset_arch }}.txt"
        dest: "{{ asset_cache }}/k3s-airgap-images-{{ k3s_asset_arch }}.tar.zst"
        timeout: "{{ asset_socket_timeout }}"
        mode: '0644'
      when: not use_offline_bundle | bool
    - name: Select container archives for chosen components
      ansible.builtin.set_fact:
        cached_image_archives: "{{ ([offline_bundle + '/images/k3s-airgap-images-' + k3s_asset_arch + '.tar.zst'] + (lookup('fileglob', offline_bundle + '/images/*.tar', wantlist=True) if rancher_enabled | bool else [])) if use_offline_bundle | bool else [asset_cache + '/k3s-airgap-images-' + k3s_asset_arch + '.tar.zst'] }}"
    - name: "Загрузка Helm charts Rancher {{ rancher_version }} и cert-manager {{ cert_manager_version }}"
      when: rancher_enabled | bool and not use_offline_bundle | bool
      register: asset_download_result
      retries: 3
      delay: 2
      until: asset_download_result is succeeded
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ asset_cache }}/{{ item.name }}-{{ item.version }}.tgz"
        mode: '0644'
        timeout: "{{ asset_socket_timeout }}"
      loop:
        - {name: rancher, version: "{{ rancher_version }}", url: "{{ rancher_chart_repo }}/rancher-{{ rancher_version }}.tgz"}
        - {name: cert-manager, version: "{{ cert_manager_version }}", url: "{{ cert_manager_chart_repo }}/charts/cert-manager-{{ cert_manager_version }}.tgz"}
    - name: Read cached Helm charts
      when: rancher_enabled | bool and not use_offline_bundle | bool
      ansible.builtin.slurp:
        src: "{{ asset_cache }}/{{ item.name }}-{{ item.version }}.tgz"
      loop:
        - {name: rancher, version: "{{ rancher_version }}"}
        - {name: cert-manager, version: "{{ cert_manager_version }}"}
      register: cached_charts
    - name: Make local charts available to Helm controller
      when: rancher_enabled | bool
      ansible.builtin.set_fact:
        rancher_chart_content: "{{ (lookup('file', offline_bundle + '/charts/rancher.b64') | trim) if use_offline_bundle | bool else cached_charts.results[0].content }}"
        cert_manager_chart_content: "{{ (lookup('file', offline_bundle + '/charts/cert-manager.b64') | trim) if use_offline_bundle | bool else cached_charts.results[1].content }}"
