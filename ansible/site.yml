---
- import_playbook: assets.yml

- name: Prepare cluster nodes
  hosts: all
  become: true
  any_errors_fatal: true
  tasks:
    - name: Check topology
      ansible.builtin.assert:
        that:
          - groups['server'] | length >= 1
          - groups['server'] | length == 1 or k3s_embedded_etcd | bool
          - groups['workers'] | length >= 1
          - dns_servers | length > 0
      run_once: true
    - name: Require enough control-plane memory for Rancher
      ansible.builtin.assert:
        that: ansible_facts.memtotal_mb | int >= 3500
        fail_msg: Rancher requires this lab's master VM to have at least 4096 MB configured. Apply resources with vagrant reload before deployment.
      when: rancher_enabled | bool and inventory_hostname in groups['server']
    - name: Check installed k3s version before changing anything
      ansible.builtin.command: /usr/local/bin/k3s --version
      register: installed_version
      changed_when: false
      failed_when: false
    - name: Require deliberate approval for changing an existing k3s version
      ansible.builtin.assert:
        that: installed_version.rc != 0 or k3s_version in installed_version.stdout or allow_version_change | bool
        fail_msg: Existing k3s version differs. This deploy playbook is not a rolling upgrade tool. Back up first; use the documented upgrade procedure.
    - name: Find private interface on each node
      ansible.builtin.set_fact:
        cluster_interface: "{{ item }}"
      loop: "{{ ansible_facts.interfaces }}"
      when: ansible_facts[item].ipv4.address | default('') == node_ip
    - name: Validate private interface exists
      ansible.builtin.assert:
        that: cluster_interface is defined
    - name: Create configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/systemd/resolved.conf.d
        - /etc/rancher/k3s
        - /usr/local/lib/k3s
    - name: Configure DNS and a private resolver for bundled CoreDNS
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/60-k3s-lab.conf
        mode: '0644'
        content: |
          [Resolve]
          DNS={{ dns_servers | join(' ') }}
          DNSOverTLS={{ 'yes' if dns_over_tls else 'no' }}
          Domains=~.
          DNSStubListenerExtra={{ node_ip }}
      register: resolver_config
    - name: Apply resolver configuration
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: restarted
      when: resolver_config.changed
    - name: Use node resolver for Pod upstream DNS
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/resolv.conf
        mode: '0644'
        content: "nameserver {{ node_ip }}\n"
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
    - name: Persist kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf
        mode: '0644'
        content: "overlay\nbr_netfilter\n"
    - name: Load kernel modules
      ansible.builtin.command: "modprobe {{ item }}"
      loop: [overlay, br_netfilter]
      changed_when: false
    - name: Enable forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-k3s.conf
        mode: '0644'
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
      register: sysctl_config
    - name: Apply forwarding
      ansible.builtin.command: sysctl --system
      when: sysctl_config.changed
    - name: Inspect active swap
      ansible.builtin.command: swapon --show --noheadings
      register: active_swap
      changed_when: false
    - name: Disable active swap
      ansible.builtin.command: swapoff -a
      when: active_swap.stdout | length > 0
    - name: Disable swap at boot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\n]+\s+\S+\s+swap\s+.*)$'
        replace: '# k3s: \1'
    - name: Distribute cached binary
      ansible.builtin.copy:
        src: "{{ asset_cache }}/k3s-arm64"
        dest: /usr/local/bin/k3s
        mode: '0755'
      register: k3s_binary
    - name: Distribute pinned installer
      ansible.builtin.copy:
        src: "{{ asset_cache }}/install.sh"
        dest: /usr/local/lib/k3s/install.sh
        mode: '0644'

- name: Start initial k3s server
  any_errors_fatal: true
  hosts: "{{ groups['server'][0] }}"
  become: true
  tasks:
    - name: Inspect SQLite datastore
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/db/state.db
      register: sqlite_db
    - name: Inspect etcd datastore
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/db/etcd/member
      register: etcd_db
    - name: Back up SQLite and credentials before conversion to etcd
      when: k3s_embedded_etcd | bool and sqlite_db.stat.exists and not etcd_db.stat.exists
      block:
        - name: Stop server for consistent backup
          ansible.builtin.systemd_service:
            name: k3s
            state: stopped
        - name: Archive original datastore and token privately
          ansible.builtin.shell: umask 077; tar -czf /var/lib/rancher/k3s/pre-etcd-backup.tar.gz -C /var/lib/rancher/k3s/server db token
          args:
            creates: /var/lib/rancher/k3s/pre-etcd-backup.tar.gz
        - name: Protect local migration backup directory
          ansible.builtin.file:
            path: "{{ playbook_dir }}/../.cache/migration/{{ inventory_hostname }}"
            state: directory
            mode: '0700'
          delegate_to: localhost
          vars:
            ansible_become: false
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
        - name: Save migration backup on Mac
          ansible.builtin.fetch:
            src: /var/lib/rancher/k3s/pre-etcd-backup.tar.gz
            dest: "{{ playbook_dir }}/../.cache/migration/{{ inventory_hostname }}/pre-etcd-backup.tar.gz"
            flat: true
          no_log: true
        - name: Protect local migration archive
          ansible.builtin.file:
            path: "{{ playbook_dir }}/../.cache/migration/{{ inventory_hostname }}/pre-etcd-backup.tar.gz"
            mode: '0600'
          delegate_to: localhost
          vars:
            ansible_become: false
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
      always:
        - name: Ensure original server is running after backup
          ansible.builtin.systemd_service:
            name: k3s
            state: started
    - name: Render server configuration
      ansible.builtin.template:
        src: config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0600'
      register: server_config
    - name: Check server service
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s.service
      register: server_service
    - name: Install server service without another download
      ansible.builtin.command: sh /usr/local/lib/k3s/install.sh
      environment:
        INSTALL_K3S_SKIP_DOWNLOAD: 'true'
        INSTALL_K3S_SKIP_START: 'true'
        INSTALL_K3S_EXEC: server
      when: k3s_binary.changed or not server_service.stat.exists
    - name: Enable and start server
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if server_config.changed or k3s_binary.changed else 'started' }}"
    - name: Wait for server API
      ansible.builtin.command: k3s kubectl get --raw=/readyz
      register: api_ready
      retries: 60
      delay: 2
      until: api_ready.rc == 0
      changed_when: false
    - name: Read generated secure agent token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/agent-token
      register: agent_token
      no_log: true

    - name: Read secure server join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/token
      register: server_join_token
      no_log: true

- name: Join additional masters sequentially
  hosts: "{{ groups['server'][1:] }}"
  serial: 1
  any_errors_fatal: true
  become: true
  tasks:
    - name: Store server join credential
      ansible.builtin.copy:
        content: "{{ hostvars[server_node].server_join_token.content | b64decode }}"
        dest: /etc/rancher/k3s/server-token
        mode: '0600'
      no_log: true
      register: join_credential
    - name: Render additional master configuration
      ansible.builtin.template:
        src: config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0600'
      register: join_config
    - name: Inspect server service
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s.service
      register: join_service
    - name: Install additional server service
      ansible.builtin.command: sh /usr/local/lib/k3s/install.sh
      environment:
        INSTALL_K3S_SKIP_DOWNLOAD: 'true'
        INSTALL_K3S_SKIP_START: 'true'
        INSTALL_K3S_EXEC: server
      when: k3s_binary.changed or not join_service.stat.exists
    - name: Start additional server
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if join_config.changed or join_credential.changed or k3s_binary.changed else 'started' }}"
    - name: Wait for additional API
      ansible.builtin.command: k3s kubectl get --raw=/readyz
      register: joined_ready
      retries: 90
      delay: 2
      until: joined_ready.rc == 0
      changed_when: false
    - name: Wait for additional master Ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout={{ node_ready_timeout }}s
      changed_when: false

- name: Join workers in parallel
  hosts: workers
  become: true
  tasks:
    - name: Store agent credential privately
      ansible.builtin.copy:
        content: "{{ hostvars[server_node].agent_token.content | b64decode }}"
        dest: /etc/rancher/k3s/agent-token
        mode: '0600'
      register: token_file
      no_log: true
    - name: Render worker configuration
      ansible.builtin.template:
        src: config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0600'
      register: worker_config
    - name: Check worker service
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s-agent.service
      register: worker_service
    - name: Install worker service without another download
      ansible.builtin.command: sh /usr/local/lib/k3s/install.sh
      environment:
        INSTALL_K3S_SKIP_DOWNLOAD: 'true'
        INSTALL_K3S_SKIP_START: 'true'
        INSTALL_K3S_EXEC: agent
      when: k3s_binary.changed or not worker_service.stat.exists
    - name: Enable and start worker
      ansible.builtin.systemd_service:
        name: k3s-agent
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if worker_config.changed or k3s_binary.changed or token_file.changed else 'started' }}"

- name: Export access and wait for cluster readiness
  hosts: "{{ groups['server'][0] }}"
  become: true
  tasks:
    - name: Wait for every expected node to register
      ansible.builtin.command: "k3s kubectl get node {{ item }}"
      loop: "{{ groups['all'] }}"
      register: registered_node
      retries: 30
      delay: 2
      until: registered_node.rc == 0
      changed_when: false
    - name: Set worker role through the Kubernetes API
      ansible.builtin.command: k3s kubectl label node {{ item }} node-role.kubernetes.io/worker=true --overwrite
      loop: "{{ groups['workers'] }}"
      register: worker_label
      changed_when: "'not labeled' not in worker_label.stdout"
    - name: Wait for all nodes Ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready nodes --all --timeout={{ node_ready_timeout }}s
      changed_when: false
    - name: Refresh system controller watches after SQLite migration
      ansible.builtin.command: k3s kubectl -n kube-system rollout restart deployment/{{ item }}
      loop: "{{ ['coredns', 'local-path-provisioner'] + (['traefik'] if 'traefik' not in disabled_components else []) }}"
      when: k3s_embedded_etcd | bool and sqlite_db.stat.exists and not etcd_db.stat.exists
    - name: Wait for bundled components on first startup
      block:
        - name: Wait for bundled CoreDNS
          ansible.builtin.command: k3s kubectl -n kube-system rollout status deployment/coredns --timeout={{ bootstrap_rollout_timeout }}s
          changed_when: false
        - name: Wait for Traefik deployment creation
          ansible.builtin.command: k3s kubectl -n kube-system get deployment traefik
          register: traefik_created
          retries: "{{ (bootstrap_rollout_timeout | int / 2) | int }}"
          delay: 2
          until: traefik_created.rc == 0
          changed_when: false
          when: "'traefik' not in disabled_components"
        - name: Wait for Traefik readiness
          ansible.builtin.command: k3s kubectl -n kube-system rollout status deployment/traefik --timeout={{ bootstrap_rollout_timeout }}s
          changed_when: false
          when: "'traefik' not in disabled_components"
      rescue:
        - name: Collect startup diagnostics
          ansible.builtin.command: "k3s kubectl -n kube-system {{ item }}"
          loop:
            - get pods -o wide
            - get events --sort-by=.metadata.creationTimestamp
            - describe pods
          register: startup_diagnostics
          changed_when: false
          failed_when: false
        - name: Show startup diagnostics
          ansible.builtin.debug:
            msg: "{{ item.stdout_lines | default([]) }}"
          loop: "{{ startup_diagnostics.results }}"
          loop_control:
            label: "{{ item.item }}"
        - name: Stop after startup timeout
          ansible.builtin.fail:
            msg: Bundled components did not become ready. Check image pull and scheduling events above; fix the cause and run ./cluster.sh up --verify again. Existing VMs are preserved.
    - name: Read kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: server_kubeconfig
      no_log: true
    - name: Write private kubeconfig with reachable server endpoint
      ansible.builtin.copy:
        content: "{{ server_kubeconfig.content | b64decode | regex_replace('https://127[.]0[.]0[.]1:[0-9]+', api_url) }}"
        dest: "{{ playbook_dir }}/../kubeconfig"
        mode: '0600'
      delegate_to: localhost
      vars:
        ansible_become: false
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      no_log: true
    - name: Show nodes
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: nodes
      changed_when: false
    - ansible.builtin.debug:
        var: nodes.stdout_lines

- import_playbook: rancher.yml

- import_playbook: traefik-dashboard.yml
