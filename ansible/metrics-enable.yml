---
- name: Enable bundled Metrics Server on existing servers
  hosts: server
  serial: 1
  become: true
  gather_facts: false
  tasks:
    - name: Read existing k3s configuration
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/config.yaml
      register: current_config
      no_log: true
    - name: Enable Metrics Server preserving other settings
      ansible.builtin.copy:
        content: "{{ (current_config.content | b64decode | from_yaml) | combine({'disable': ((current_config.content | b64decode | from_yaml).get('disable', []) | difference(['metrics-server']))}) | to_nice_yaml }}"
        dest: /etc/rancher/k3s/config.yaml
        mode: '0600'
      register: metrics_config
      no_log: true
    - name: Restart k3s when configuration changed
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when: metrics_config.changed
    - name: Wait for Kubernetes API
      ansible.builtin.command: k3s kubectl get --raw=/readyz --request-timeout=5s
      register: api_ready
      until: api_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false
- import_playbook: metrics-verify.yml
