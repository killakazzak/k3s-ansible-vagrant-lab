---
- name: Verify k3s DNS and cross-node networking
  hosts: "{{ groups['server'][0] }}"
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Read nodes
      ansible.builtin.command: kubectl get nodes -o json
      register: nodes_json
      changed_when: false
    - name: Check topology
      ansible.builtin.assert:
        that:
          - (nodes_json.stdout | from_json)['items'] | length == groups['all'] | length
    - name: Run temporary network checks
      block:
        - name: Create network test resources
          ansible.builtin.command: kubectl apply -f -
          args:
            stdin: |
              apiVersion: v1
              kind: Namespace
              metadata:
                name: {{ smoke_namespace }}
              ---
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: web
                namespace: {{ smoke_namespace }}
              spec:
                selector:
                  matchLabels: {app: smoke-web}
                template:
                  metadata:
                    labels: {app: smoke-web}
                  spec:
                    nodeSelector:
                      node-role.kubernetes.io/worker: "true"
                    containers:
                      - name: nginx
                        image: "{{ smoke_web_image }}"
                        ports: [{containerPort: 80}]
                        resources: {{ smoke_web_resources | to_json }}
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: web
                namespace: {{ smoke_namespace }}
              spec:
                selector: {app: smoke-web}
                ports: [{port: 80, targetPort: 80}]
              ---
              apiVersion: v1
              kind: Pod
              metadata:
                name: client
                namespace: {{ smoke_namespace }}
              spec:
                nodeSelector:
                  kubernetes.io/hostname: "{{ smoke_client_node }}"
                containers:
                  - name: client
                    image: "{{ smoke_client_image }}"
                    command: ["sleep", "{{ smoke_client_lifetime }}"]
                    resources: {{ smoke_client_resources | to_json }}
        - name: Create Traefik test ingress
          ansible.builtin.command: kubectl apply -f -
          args:
            stdin: |
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: web
                namespace: {{ smoke_namespace }}
              spec:
                ingressClassName: traefik
                rules:
                  - host: {{ smoke_ingress_host }}
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: web
                              port:
                                number: 80
          when: "'traefik' not in disabled_components"
        - name: Wait for servers on both workers
          ansible.builtin.command: kubectl -n {{ smoke_namespace }} rollout status daemonset/web --timeout={{ rollout_timeout }}s
          changed_when: false
        - name: Wait for client
          ansible.builtin.command: kubectl -n {{ smoke_namespace }} wait --for=condition=Ready pod/client --timeout={{ rollout_timeout }}s
          changed_when: false
        - name: Check cluster DNS
          ansible.builtin.command: kubectl -n {{ smoke_namespace }} exec client -- nslookup kubernetes.default.svc.{{ cluster_domain }}
          changed_when: false
        - name: Check Service routing
          ansible.builtin.command: kubectl -n {{ smoke_namespace }} exec client -- wget -q -T {{ smoke_http_timeout }} -O /dev/null http://web.{{ smoke_namespace }}.svc.{{ cluster_domain }}
          changed_when: false
        - name: Check external DNS through CoreDNS
          ansible.builtin.command: kubectl -n {{ smoke_namespace }} exec client -- nslookup {{ smoke_external_domain }}
          changed_when: false
        - name: Check Traefik ingress through worker port 80
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - "{{ smoke_namespace }}"
              - exec
              - client
              - --
              - wget
              - -q
              - -T
              - "{{ smoke_http_timeout | string }}"
              - -O
              - /dev/null
              - "--header=Host: {{ smoke_ingress_host }}"
              - "http://{{ hostvars[smoke_client_node].ansible_host }}"
          register: ingress_check
          retries: 30
          delay: 2
          until: ingress_check.rc == 0
          changed_when: false
          when: "'traefik' not in disabled_components and 'servicelb' not in disabled_components"
        - name: Read server pod IPs
          ansible.builtin.command: kubectl -n {{ smoke_namespace }} get pods -l app=smoke-web -o json
          register: server_pods
          changed_when: false
        - name: Check direct access to pods on both workers
          ansible.builtin.command: "kubectl -n {{ smoke_namespace }} exec client -- wget -q -T {{ smoke_http_timeout }} -O /dev/null http://{{ item.status.podIP }}"
          loop: "{{ (server_pods.stdout | from_json)['items'] }}"
          loop_control:
            label: "{{ item.spec.nodeName }} / {{ item.status.podIP }}"
          changed_when: false
      rescue:
        - name: Collect failed test pod diagnostics
          ansible.builtin.command: kubectl -n {{ smoke_namespace }} get pods -o wide
          register: smoke_failed_pods
          changed_when: false
          failed_when: false
        - name: Collect failed test events
          ansible.builtin.command: kubectl -n {{ smoke_namespace }} get events --sort-by=.lastTimestamp
          register: smoke_failed_events
          changed_when: false
          failed_when: false
        - name: Explain failed network check
          ansible.builtin.fail:
            msg: "Проверка сети не пройдена; созданные узлы сохранены. Pod: {{ smoke_failed_pods.stdout }}. События: {{ smoke_failed_events.stdout }}"
      always:
        - name: Remove temporary test namespace
          ansible.builtin.command: kubectl delete namespace {{ smoke_namespace }} --ignore-not-found --wait=false
