apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../pelmeni
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: pelmeni
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: pelmeni.192.168.69.11.sslip.io
