apiVersion: v1
kind: Namespace
metadata:
  name: pelmeni
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelmeni
  namespace: pelmeni
spec:
  replicas: 1
  selector:
    matchLabels: {app: pelmeni}
  template:
    metadata:
      labels: {app: pelmeni}
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.4-alpine
          ports:
            - {name: http, containerPort: 80}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - {name: page, mountPath: /usr/share/nginx/html, readOnly: true}
      volumes:
        - name: page
          configMap: {name: pelmeni-page}
---
apiVersion: v1
kind: Service
metadata:
  name: pelmeni
  namespace: pelmeni
spec:
  selector: {app: pelmeni}
  ports:
    - {port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pelmeni
  namespace: pelmeni
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: pelmeni.192.168.59.11.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pelmeni
                port: {number: 80}
